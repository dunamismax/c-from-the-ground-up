# Local development database. Production uses PostgreSQL 18 installed on the
# server (see BUILD.md, milestone W5); this file is for development and tests.
#
#   npm run db:start    start it in the background and wait until it is healthy
#   npm run db:stop     stop it (data is kept in the pgdata volume)
#
# The host port defaults to 5434 so it does not collide with a PostgreSQL
# already installed on 5432. Override it with DB_PORT in site/.env.
name: cfromthegroundup

services:
  db:
    image: postgres:18
    ports:
      - 127.0.0.1:${DB_PORT:-5434}:5432
    environment:
      POSTGRES_USER: cftgu
      POSTGRES_PASSWORD: cftgu
      POSTGRES_DB: cfromthegroundup
    volumes:
      # PostgreSQL 18 images keep data in a versioned directory under
      # /var/lib/postgresql, so mount the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cftgu -d cfromthegroundup']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
