name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mdbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Check chapter listings match lesson sources
        run: python3 scripts/sync_chapters.py --check

      # Pinned: other clang-format majors can format a few constructs
      # differently from the version the lessons were formatted with.
      - name: Check lesson formatting
        run: |
          pipx install clang-format==23.1.5
          make check-format

      - name: Build book
        run: mdbook build

      - name: Check internal links and anchors
        run: python3 scripts/check_book_links.py

  smoke-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - clang
          - gcc

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ncurses headers
        run: sudo apt-get update && sudo apt-get install --yes libncurses-dev

      - name: Run smoke check
        env:
          CC: ${{ matrix.compiler }}
        run: sh scripts/smoke_check.sh

  # Every lesson under ASan/UBSan/LeakSanitizer and MemorySanitizer, the
  # threaded lesson under ThreadSanitizer, and a short fuzz run of the two
  # file parsers. Nothing may be skipped here.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Clang and ncurses headers
        run: sudo apt-get update && sudo apt-get install --yes clang libncurses-dev

      # MemorySanitizer and ThreadSanitizer cannot map their shadow memory
      # with the runner's high-entropy ASLR.
      - name: Lower ASLR entropy for the sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run sanitizer check
        env:
          CC: clang
          SANITIZERS_REQUIRED: '1'
        run: sh scripts/sanitizer_check.sh

      # libFuzzer over the parsers of lessons 34 and 35 (fuzz/), a short run
      # from the committed seeds. A finding fails the job and the input that
      # caused it is uploaded.
      - name: Fuzz the lesson parsers
        env:
          CC: clang
          FUZZ_REQUIRED: '1'
        run: sh scripts/fuzz_check.sh

      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Static analysis: clang-tidy (.clang-tidy, pinned to the version the
  # config was tuned with) and GCC's -fanalyzer.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install ncurses headers
        run: sudo apt-get update && sudo apt-get install --yes libncurses-dev

      - name: clang-tidy
        run: |
          pipx install clang-tidy==23.1.4
          make tidy

      # Blocking since 2026-11-20: GCC 14 (here), 15 and 16 report nothing for
      # the lessons. A new finding after a GCC upgrade needs a real look, not
      # continue-on-error.
      - name: GCC static analyzer
        run: make analyze GCC="$(command -v gcc-14 || command -v gcc)"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cftgu
          POSTGRES_PASSWORD: cftgu
          POSTGRES_DB: cfromthegroundup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cftgu -d cfromthegroundup"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://cftgu:cftgu@127.0.0.1:5432/cfromthegroundup

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # No version input: it reads packageManager (pnpm@12.18.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Check the toolchain
        run: test "$(node --version)" = v26.13.1 && test "$(pnpm --version)" = 12.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      # Vitest component tests and the e2e tests both run in Chromium.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: End-to-end tests
        run: pnpm run test:e2e
