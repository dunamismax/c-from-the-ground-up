name: deploy

on:
  push:
    branches:
      - main
  # A manual run publishes the book again without a new push. Use it when
  # deploy-pages fails with "No artifacts named github-pages": re-running the
  # failed job then fails with "Multiple artifacts", but a fresh run uploads
  # its own artifact.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      # Never publish listings that differ from the lesson files.
      - name: Check chapter listings match lesson sources
        run: python3 scripts/sync_chapters.py --check

      - name: Build book
        run: mdbook build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
